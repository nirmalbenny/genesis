# CI on every push and pull request; deploy to Firebase on pushes to main once checks pass.
# Auth uses Workload Identity Federation (no keys). One-time setup: scripts/setup-github-deploy.sh
# Config comes from GitHub repository variables (Settings → Secrets and variables → Actions → Variables).
# Real secrets stay in Google Secret Manager; this workflow never sees their values.
name: CI / Deploy

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", ".env.example", "**/.env.example"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Type-check, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            functions/package-lock.json
            frontend/package-lock.json

      - name: Functions — install and test
        working-directory: functions
        run: |
          npm ci
          npm test

      - name: Frontend — write production env
        working-directory: frontend
        run: |
          cat > .env.production <<EOF
          VITE_FIREBASE_API_KEY=${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN=${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID=${{ vars.FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID=${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_FUNCTIONS_BASE_URL=https://us-central1-${{ vars.FIREBASE_PROJECT_ID }}.cloudfunctions.net
          VITE_USE_EMULATORS=false
          EOF

      - name: Frontend — install, type-check and build
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 3

  deploy:
    name: Deploy to Firebase
    needs: check
    # Skipped until scripts/setup-github-deploy.sh has stored WIF_PROVIDER.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.WIF_PROVIDER != ''
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write   # lets GitHub prove its identity to Google (Workload Identity Federation)
    env:
      PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Functions — install and write params
        working-directory: functions
        run: |
          npm ci
          cat > .env <<EOF
          ANTHROPIC_MODEL=${{ vars.ANTHROPIC_MODEL }}
          ANTHROPIC_SUMMARY_MODEL=${{ vars.ANTHROPIC_SUMMARY_MODEL }}
          EOF
          cat > ".env.${PROJECT_ID}" <<EOF
          HL_REDIRECT_URI=https://us-central1-${PROJECT_ID}.cloudfunctions.net/hlAuthCallback
          APP_URL=https://${PROJECT_ID}.web.app
          EOF

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SERVICE_ACCOUNT }}

      - name: Deploy (Firestore rules, functions, hosting)
        run: npx --yes firebase-tools@15.35.0 deploy --project "$PROJECT_ID" --non-interactive
